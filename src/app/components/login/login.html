<div class="login-wrapper">
  <div class="login-card">
    <div class="header-section">
      <h1>Forge Fine Auctions</h1>
      <div class="forn-deco">&#x2015;&nbsp;&#x2605;&nbsp;&#x2015;</div>
      <p class="est">&#x2715; Est. MMXXVI &#x2715;</p>
    </div>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
      <div class="form-group">
        <label>Email Address</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          placeholder="e.g. don@forge.com">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          placeholder="••••••••">
      </div>

      <button type="submit" [disabled]="!loginForm.valid || isLoading" class="btn-login">
        {{ isLoading ? 'Validating...' : '→ Enter the Forge' }}
      </button>
    </form>

    <p class="footer-note">Secure Access for Authorized Bidders Only</p>
  </div>
</div>
