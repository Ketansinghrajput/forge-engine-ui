<div class="login-wrapper">
  <div class="login-card">
    <div class="header-section">
      <h1>FORGE FINE AUCTIONS</h1>
      <p class="est">EST. MMXXVI</p>
    </div>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
      <div class="form-group">
        <label>EMAIL ADDRESS</label>
        <input 
          type="email" 
          [(ngModel)]="email" 
          name="email" 
          required 
          placeholder="e.g. don@forge.com">
      </div>

      <div class="form-group">
        <label>PASSWORD</label>
        <input 
          type="password" 
          [(ngModel)]="password" 
          name="password" 
          required>
      </div>

      <button type="submit" [disabled]="!loginForm.valid || isLoading" class="btn-login">
        {{ isLoading ? 'VALIDATING...' : 'ENTER THE FORGE' }}
      </button>
    </form>
    
    <p class="footer-note">Secure Access for Authorized Bidders Only</p>
  </div>
</div>
